# ==========================================================
# FAMS Docker Compose
# Version : 1.2
# Services: PostgreSQL 17 + PostGIS, Redis 7, MinIO, Backend, Frontend, BullMQ Worker, Nginx, Prometheus, Grafana, Loki
# Usage:
#   dev:  docker compose --env-file .env.development up -d
#   prod: docker compose --env-file .env.production up -d
# ==========================================================

services:

  # ── PostgreSQL 17 + PostGIS ──────────────────────────────
  postgres:
    image: postgis/postgis:17-3.5
    container_name: fams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fams_dev}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-fams_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'

  # ── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fams-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_dev}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── MinIO (S3-Compatible Object Storage) ─────────────────
  minio:
    image: minio/minio:latest
    container_name: fams-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  # ── Backend (NestJS) ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: fams-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  # ── BullMQ Worker ────────────────────────────────────────
  bullmq-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: fams-bullmq-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── Frontend (Next.js) ───────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: fams-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_URL:-http://localhost:3001}/api/v1
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  # ── Nginx (Reverse Proxy) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fams-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # ── Prometheus (Metrics) ─────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fams-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── Grafana (Dashboards) ─────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: fams-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── Loki (Logs) ──────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.2
    container_name: fams-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fams-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

# ── Volumes ──────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ── Networks ─────────────────────────────────────────────
networks:
  fams-network:
    driver: bridge
