# ==========================================================
# FAMS Docker Compose
# Version : 1.1
# Services: PostgreSQL 17 + PostGIS, Redis 7, MinIO, Backend, Frontend, Nginx, Prometheus, Grafana, Loki
# ==========================================================

services:

  # ── PostgreSQL 17 + PostGIS ──────────────────────────────
  postgres:
    image: postgis/postgis:17-3.5
    container_name: fams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fams_dev}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-fams_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fams-network

  # ── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fams-redis
    restart: unless-stopped
    # command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    # Simplify for local dev without password for now, or use env
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fams-network

  # ── MinIO (S3-Compatible Object Storage) ─────────────────
  minio:
    image: minio/minio:latest
    container_name: fams-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fams-network

  # ── Backend (NestJS) ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: fams-backend
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fams_dev?schema=public
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fams-network

  # ── BullMQ Worker (NestJS Worker) ────────────────────────
  bullmq:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: fams-bullmq-worker
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fams_dev?schema=public
      REDIS_HOST: redis
      # Command override if we had a separate worker entrypoint:
      # command: npm run start:worker
    depends_on:
      - redis
      - postgres
    networks:
      - fams-network

  # ── Frontend (Next.js) ───────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: fams-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - fams-network

  # ── Nginx (Reverse Proxy) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fams-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - fams-network

  # ── Prometheus (Metrics) ─────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fams-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fams-network

  # ── Grafana (Dashboards) ─────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: fams-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - fams-network

  # ── Loki (Logs) ──────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.2
    container_name: fams-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fams-network

# ── Volumes ──────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ── Networks ─────────────────────────────────────────────
networks:
  fams-network:
    driver: bridge
