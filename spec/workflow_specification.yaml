# ==========================================================
# FAMS WORKFLOW SPECIFICATION
# Version : 1.0
# Target  : Antigravity AI
# ==========================================================

workflows:

# ==========================================================
# CUSTOMER ACTIVATION
# ==========================================================

  customer_activation:

    trigger: Create Customer

    flow:

      - Validate Customer
      - Check Homepass
      - Check ODP
      - Check Free Port
      - Reserve Port
      - Assign Splitter
      - Assign Fiber Core
      - Create Customer
      - Assign Package
      - Assign ONU
      - Generate QR
      - Create Work Order
      - Notify Technician
      - Audit Log

    rollback:
      - Release Port
      - Delete Customer
      - Delete Assignment

# ==========================================================
# CUSTOMER RELOCATION
# ==========================================================

  customer_relocation:

    flow:

      - Validate Customer
      - Check New Homepass
      - Find Nearest ODP
      - Reserve New Port
      - Release Old Port
      - Update Fiber Route
      - Update Customer
      - Create Work Order
      - Audit Log

# ==========================================================
# CUSTOMER TERMINATION
# ==========================================================

  customer_termination:

    flow:

      - Validate Customer
      - Disable Service
      - Release ONU
      - Release Port
      - Update Status
      - Close Subscription
      - Audit Log

# ==========================================================
# SURVEY TO HOMEPASS
# ==========================================================

  survey_homepass:

    flow:

      - Input Coordinate
      - Capture Photo
      - Validate GPS
      - Save Survey
      - Supervisor Approval
      - Convert To Homepass

# ==========================================================
# HOMEPASS TO CUSTOMER
# ==========================================================

  homepass_conversion:

    flow:

      - Select Homepass
      - Input Customer
      - Validate Address
      - Save Customer
      - Create Activation WO

# ==========================================================
# NEAREST ODP
# ==========================================================

  nearest_odp:

    trigger: GPS Coordinate

    flow:

      - Validate Coordinate
      - Query PostGIS
      - Calculate Distance
      - Filter Available Port
      - Sort Distance
      - Return Top 5 ODP

# ==========================================================
# FIBER TRACE
# ==========================================================

  fiber_trace:

    trigger:
      - Customer
      - ODP
      - Fiber Core

    flow:

      - Locate Asset
      - Read Fiber Core
      - Read Splice
      - Traverse Route
      - Build Path
      - Display Map
      - Export PDF

# ==========================================================
# IMPACT ANALYSIS
# ==========================================================

  impact_analysis:

    trigger:
      - Fiber Cut
      - ODP Down
      - OLT Down

    flow:

      - Locate Asset
      - Traverse Network
      - Find Customers
      - Find Dependent Assets
      - Generate Impact Report

# ==========================================================
# WORK ORDER
# ==========================================================

  workorder:

    states:

      - Open
      - Assigned
      - Accepted
      - On Site
      - In Progress
      - Completed
      - Approved
      - Closed

# ==========================================================
# WORK ORDER INSTALLATION
# ==========================================================

  installation:

    flow:

      - Create WO
      - Assign Technician
      - Accept WO
      - Navigate Location
      - Install ONU
      - Test Connection
      - Upload Photos
      - Complete
      - Supervisor Approval

# ==========================================================
# TROUBLE TICKET
# ==========================================================

  trouble_ticket:

    flow:

      - Create Ticket
      - Assign Technician
      - Diagnosis
      - Repair
      - Validation
      - Close Ticket

# ==========================================================
# QR SCAN
# ==========================================================

  qr_scan:

    flow:

      - Scan QR
      - Decode Token
      - Find Asset
      - Open Detail
      - Show History

# ==========================================================
# GIS
# ==========================================================

  gis_asset:

    flow:

      - Open Map
      - Load Layers
      - Load Assets
      - Render Marker
      - Click Marker
      - Open Detail

# ==========================================================
# AI ASSISTANT
# ==========================================================

  ai_chat:

    flow:

      - Receive Prompt
      - Identify Intent
      - Query Database
      - Query GIS
      - Build Context
      - Generate Response
      - Save History

# ==========================================================
# MONITORING
# ==========================================================

  monitoring:

    flow:

      - Poll Device
      - Update Status
      - Generate Alarm
      - Notify User
      - Dashboard Update

# ==========================================================
# BACKUP
# ==========================================================

  backup:

    schedule:

      - Every 6 Hours
      - Daily
      - Weekly
      - Monthly

    flow:

      - Backup Database
      - Backup Object Storage
      - Verify Backup
      - Store Metadata

# ==========================================================
# NOTIFICATION
# ==========================================================

  notification:

    channels:

      - Telegram
      - WhatsApp
      - Email
      - In App

    trigger:

      - Work Order
      - Alarm
      - Customer Activation
      - Fiber Cut
      - Approval

# ==========================================================
# AUDIT LOG
# ==========================================================

  audit:

    trigger:

      - Create
      - Update
      - Delete
      - Login
      - Logout
      - Approval

# ==========================================================
# ANTIGRAVITY GENERATION
# ==========================================================

generate:

  state_machine: true
  workflow_engine: true
  event_bus: true
  queue_job: true
  audit_log: true
  notification_hook: true
  rollback_support: true
  diagram_generation: true