repository:

  root:

    backend:

      src:
        auth/
        users/
        roles/
        permissions/

        dashboard/

        assets/
        network/
        fiber/
        gis/
        homepass/
        customers/
        workorders/
        monitoring/
        notifications/
        reports/
        ai/
        system/

        common/
        config/
        database/
        guards/
        interceptors/
