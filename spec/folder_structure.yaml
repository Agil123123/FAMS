        models/
        widgets/
        routes/

    infrastructure:

      docker/
      nginx/
      monitoring/
      scripts/

    docs/

    spec/

    .github/

rules:

  feature_first: true

  no_duplicate_components: true

  reusable_only: true

  shared_component_directory:
    - components/ui
    - components/layout

  feature_component_directory:
    - features/*