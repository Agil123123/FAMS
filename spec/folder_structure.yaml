      prisma/
      test/

    frontend:

      src:

        app/

        components/
          ui/
          layout/
          maps/
          tables/
          charts/
          forms/

        features/
          dashboard/
          assets/
          network/
          fiber/
          gis/
          homepass/
          customers/
          workorders/
          monitoring/
          reports/
          ai/

        hooks/
        lib/
        services/
        store/
        types/
        utils/

      public/

    mobile:

      lib/

        core/
        config/
        shared/

        features/
          dashboard/
          assets/
          network/
          fiber/
          gis/
          homepass/
          customers/
          workorders/
          monitoring/
          reports/
          ai/

        services/
