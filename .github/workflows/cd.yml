# ==========================================================
# FAMS CD Pipeline
# Runs on: Push to main
# ==========================================================

name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_LC: ${{ github.repository }}

jobs:

  # ── Build & Push Docker Images ───────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -f infrastructure/docker/backend.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/backend:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/backend:${{ github.sha }} \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/backend:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/backend:${{ github.sha }}

      - name: Build & Push Frontend
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -f infrastructure/docker/frontend.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/frontend:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/frontend:${{ github.sha }} \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/frontend:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/frontend:${{ github.sha }}

  # ── Deploy ───────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/fams
            docker compose --env-file .env.production pull
            docker compose --env-file .env.production run --rm backend npx prisma migrate deploy
            docker compose --env-file .env.production up -d --remove-orphans
            docker image prune -f
            echo "✅ Deploy complete — $(docker compose ps --format json | wc -l) services running"
