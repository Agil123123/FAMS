# ==========================================================
# FAMS CD Pipeline
# Runs on: Push to main
# ==========================================================

name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # ── Build & Push Docker Images ───────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image prefix (GHCR requires lowercase)
        run: |
          echo "IMAGE_PREFIX_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/backend:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LC }}/frontend:${{ github.sha }}

  # ── Deploy ───────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/fams

            # Pull latest images
            docker compose --env-file .env.production pull

            # Run migrations
            docker compose --env-file .env.production run --rm backend npx prisma migrate deploy

            # Restart services
            docker compose --env-file .env.production up -d --remove-orphans

            # Cleanup old images
            docker image prune -f

            echo "✅ Deploy complete — $(docker compose ps --format json | wc -l) services running"
